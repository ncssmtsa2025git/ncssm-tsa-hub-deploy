# Monthly dependency updates, grouped so each app gets at most one routine PR a month.
# Security fixes still open right away. CI runs on every PR; merge when it's green.
version: 2
updates:
  - package-ecosystem: npm
    directory: /website-frontend
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /admin-panel
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
